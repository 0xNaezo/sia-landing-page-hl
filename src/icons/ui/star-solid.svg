<!-- Rating star. Monochrome on purpose: .tstars colours it with var(--gold), and the
     Noto ⭐ would ignore that. The 2-unit padding inside the 28 box keeps the visible
     star at ~0.74em, matching the text ★ glyph it replaces. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28"><g transform="translate(2 2)" fill="currentColor"><path d="M12 2.6l2.9 5.88 6.49.94-4.7 4.58 1.11 6.46L12 17.41l-5.8 3.05 1.1-6.46-4.69-4.58 6.49-.94z"/></g></svg>
